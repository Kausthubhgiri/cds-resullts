<script>
const DEFAULT_SCHOOLS=[];
let scores=[],winners=[],registeredSchools=[],participants=[],ws,retry=0;
let adConfig={enabled:false,intervalMinutes:3,nextAdAt:0},adFiles=[],adIndex=0,adPlaying=false,adDueAt=0,lastAdClock=Date.now(),serverClockOffset=0,lastViewerStatusAt=0;
let phase='score',phaseTimer=null,phaseEndsAt=0,pausedPhase=null,pausedRemaining=0,scoreReturnTimer=null;
let winnerQueue=[],pendingWinnerCount=0,winnerPages=[],winnerPageIndex=0,participantGroups=[],participantEventIndex=0,participantOffsets={};
let adPending=false,adWaitTimer=null;
const $=id=>document.getElementById(id);const isRelay=e=>/relay/i.test(e||'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function displayPosition(p){return ({Gold:'1st',Silver:'2nd',Bronze:'3rd',gold:'1st',silver:'2nd',bronze:'3rd'}[String(p||'')]||String(p||'WINNER'));}
function safePhoto(url){try{const u=new URL(String(url||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function renderScores(){const schools=[...new Set(registeredSchools.map(name=>String(name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const rows=schools.map((name,i)=>({name,score:Number(scores[i]?.score??scores[i]??0),i})).sort((a,b)=>b.score-a.score);const rest=rows.slice(3);$('podium').innerHTML=rows.slice(0,3).map((s,i)=>`<article class="school-card ${['gold','silver','bronze'][i]}"><div class="podium-copy"><div class="school-name">${esc(s.name)}</div><div class="score">${s.score}</div></div><div class="podium-medal">${['🥇','🥈','🥉'][i]}</div></article>`).join('');const grid=$('school-rest');grid.innerHTML=rest.map(s=>`<article class="table-card"><div class="school-name">${esc(s.name)}</div><div class="small-score">${s.score}</div></article>`).join('');let cols=rest.length<=6?3:rest.length<=12?4:rest.length<=20?5:6;cols=Math.min(cols,Math.max(1,rest.length));const rc=Math.ceil(rest.length/cols);grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${Math.max(1,rc)},minmax(0,1fr))`;}
function winnerCapacity(){const w=window.innerWidth,h=window.innerHeight;const cols=w<650?1:w<1050?2:4;const rows=h<650?2:h<850?3:4;return Math.max(1,cols*rows);}
function buildWinnerPages(){const ordered=[...winners].sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));const size=winnerCapacity();winnerPages=[];for(let i=0;i<ordered.length;i+=size)winnerPages.push(ordered.slice(i,i+size));if(!winnerPages.length)winnerPages=[[]];}
function renderWinnerPage(){buildWinnerPages();winnerPageIndex=Math.min(winnerPageIndex,winnerPages.length-1);const page=winnerPages[winnerPageIndex]||[];$('winners-grid').innerHTML=page.length?page.map(w=>`<article class="winner-card"><div class="medal">${esc(displayPosition(w.position))}</div>${!isRelay(w.event)&&safePhoto(w.photoUrl)?`<img class="winner-photo" src="${esc(safePhoto(w.photoUrl))}" alt="${esc(w.name||'Winner')}" onerror="this.style.display='none'">`:''}<div class="winner-name">${esc(isRelay(w.event)?w.school:w.name)}</div><div class="winner-school">${esc(isRelay(w.event)?'Relay Team':w.school)}</div><div class="winner-meta">${esc(w.event)} · ${esc(w.ageCategory||'')}</div></article>`).join(''):'<div class="empty">Winners will appear here after announcements.</div>';$('winner-page-count').textContent=winnerPages.length>1?`PAGE ${winnerPageIndex+1} / ${winnerPages.length}`:'';}
function normalizeParticipant(r){const name=r.name??r.Name??r.participantName??r.participant_name??'';const school=r.school??r.School??r.schoolName??r.school_name??'';let ev=r.event??r.Event??r.events??r.eventName??r.event_name??'';const events=Array.isArray(ev)?ev.map(x=>typeof x==='string'?x:(x.name||x.event||'')):String(ev).split(/[,;|]/).map(x=>x.trim()).filter(Boolean);return events.map(event=>({name:String(name).trim(),school:String(school).trim(),event:String(event).trim(),age:String(r.ageCategory??r['Age Category']??r.age_category??r.category??'').trim(),gender:String(r.gender??r.Gender??'').trim(),chest:String(r.chest??r.Chest??r.chestNumber??r.chest_number??''),photo:safePhoto(r.photoUrl??r.photoPath??r['Photo URL']??r.photo??r.photo_url??'')})).filter(x=>x.name&&x.school&&x.event);}
async function loadParticipants(){try{const res=await fetch('/api/participants',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const d=await res.json();const rows=Array.isArray(d)?d:(d.participants||d.results||d.data||[]);participants=rows.flatMap(normalizeParticipant);const grouped=new Map();for(const p of participants){if(!grouped.has(p.event))grouped.set(p.event,[]);grouped.get(p.event).push(p);}participantGroups=[...grouped.entries()].sort((a,b)=>a[0].localeCompare(b[0]));}catch(e){console.warn('Participant showcase unavailable',e);}}
function participantCapacity(){const cols=window.innerWidth<650?1:window.innerWidth<1050?2:4;const rows=window.innerHeight<650?2:window.innerHeight<850?2:3;return Math.max(1,cols*rows);}
function advanceParticipantCursor(){
  if(!participantGroups.length)return false;
  const [event,list]=participantGroups[participantEventIndex]||[];
  if(!event||!list)return false;

  // Stay on this event and show its next participant page first.
  const next=(participantOffsets[event]||0)+participantCapacity();
  if(next<list.length){
    participantOffsets[event]=next;
    return true;
  }

  // This event is complete. Return to the scoreboard now; the next
  // participant phase will continue with the following event.
  participantOffsets[event]=0;
  participantEventIndex=(participantEventIndex+1)%participantGroups.length;
  return false;
}
function renderParticipantPage(){
  if(!participantGroups.length){
    $('participant-event-label').textContent='NO PARTICIPANT DATA AVAILABLE';
    $('participants-grid').innerHTML='<div class="empty">Participant registrations will appear here when available.</div>';
    $('participant-page-count').textContent='';
    return;
  }
  if(participantEventIndex>=participantGroups.length)participantEventIndex=0;
  const [event,list]=participantGroups[participantEventIndex];
  const size=participantCapacity();
  let offset=participantOffsets[event]||0;
  if(offset>=list.length)offset=0;
  const page=list.slice(offset,offset+size);
  $('participant-event-label').textContent=event.toUpperCase();$('participants-grid').dataset.event=event;
  $('participants-grid').innerHTML=page.map(p=>`<article class="participant-card"><img src="${esc(p.photo||'')}" alt="" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23263347%22/%3E%3Ccircle cx=%2250%22 cy=%2236%22 r=%2218%22 fill=%22%23899ab0%22/%3E%3Cpath d=%22M15 100c2-25 15-38 35-38s33 13 35 38%22 fill=%22%23899ab0%22/%3E%3C/svg%3E'"><div><div class="p-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="p-school" title="${esc(p.school)}">${esc(p.school)}</div><div class="p-chest">${[p.age?'Age: '+p.age:'',p.gender?'Gender: '+p.gender:'',p.chest?'Chest No.: '+p.chest:''].filter(Boolean).map(esc).join(' · ')}</div></div></article>`).join('');
  $('participant-page-count').textContent=`${Math.floor(offset/size)+1} / ${Math.ceil(list.length/size)} · ${participantEventIndex+1} OF ${participantGroups.length} EVENTS`;
  fitParticipantNames();
}
function fitParticipantNames(){
  document.querySelectorAll('.participant-card .p-name').forEach(el=>{
    el.style.fontSize='';
    const parent=el.parentElement;
    const available=parent.clientWidth;
    let size=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>available && size>9){size-=.5;el.style.fontSize=size+'px';}
  });
}
function show(which){phase=which;for(const id of ['score','winners','participants','ad']){$(id+'-screen').classList.toggle('active',which===id);}}
function clearPhaseTimer(){if(phaseTimer){clearTimeout(phaseTimer);phaseTimer=null;}}
function startPhase(which,duration=15000){
  clearPhaseTimer();show(which);
  if(which==='winners'){winnerPageIndex=0;renderWinnerPage();}
  if(which==='participants')renderParticipantPage();
  phaseEndsAt=Date.now()+duration;
  if(which==='score'&&adPending&&!adPlaying&&!winnerQueue.length&&!$('announcement').classList.contains('show')){
    clearTimeout(adWaitTimer);
    adWaitTimer=setTimeout(()=>{adWaitTimer=null;if(adPending&&!adPlaying&&phase==='score'&&!winnerQueue.length&&!$('announcement').classList.contains('show'))playNextAd();},15000);
    phaseTimer=setTimeout(()=>{phaseTimer=null;},15000);
  }else phaseTimer=setTimeout(advancePhase,duration);
  publishViewerStatus();
}
function serverNow(){return Date.now()+serverClockOffset;}
function estimatedAdStart(){
  if(!adConfig.enabled||!adConfig.nextAdAt)return 0;
  if(serverNow()<adConfig.nextAdAt)return adConfig.nextAdAt;
  if(adPlaying)return 0;
  if(phase==='score'&&!pausedPhase&&!winnerQueue.length&&!$('announcement').classList.contains('show'))return Math.max(serverNow(),phaseEndsAt);
  if($('announcement').classList.contains('show')||pausedPhase)return 0;
  let untilScore=0;
  if(phase==='participants'){
    const [event,list]=participantGroups[participantEventIndex]||[];const size=participantCapacity();const offset=event?(participantOffsets[event]||0):0;
    const pagesLeft=event&&list?Math.max(1,Math.ceil((list.length-offset)/size)):1;
    untilScore=Math.max(0,phaseEndsAt-Date.now())+Math.max(0,pagesLeft-1)*7000;
  }else if(phase==='winners')untilScore=Math.max(0,phaseEndsAt-Date.now())+Math.max(0,winnerPages.length-winnerPageIndex-1)*15000;
  else return 0;
  return serverNow()+untilScore+15000;
}
function publishViewerStatus(){
  if(!ws||ws.readyState!==1)return;
  const due=!!(adConfig.enabled&&adConfig.nextAdAt&&serverNow()>=adConfig.nextAdAt);
  const estimate=adPlaying?0:(due?estimatedAdStart():adConfig.nextAdAt||0);
  let note=adPlaying?'Advertisement is playing':!adConfig.enabled?'Advertisements disabled':!due?'Waiting for configured interval':$('announcement').classList.contains('show')?'Waiting for winner announcement':pausedPhase?'Paused by live interruption':due&&phase!=='score'?'Waiting for scoreboard, then 15-second hold':due?'Scoreboard hold before advertisement':'Scheduled';
  ws.send(JSON.stringify({type:'viewer-status',phase,phaseEndsAt:Math.round(serverNow()+Math.max(0,phaseEndsAt-Date.now())),adPending:due||adPending,adPlaying,estimatedAdAt:estimate,note}));
}
function advancePhase(){
  phaseTimer=null;
  if(phase==='winners'){
    if(winnerPageIndex+1<winnerPages.length){winnerPageIndex++;renderWinnerPage();phaseEndsAt=Date.now()+15000;phaseTimer=setTimeout(advancePhase,15000);return;}
    startPhase('score',15000);return;
  }
  if(phase==='score'){
    if(winners.length>=5)startPhase('winners',15000);
    else startPhase('participants',7000);
    return;
  }
  if(phase==='participants'){
    if(advanceParticipantCursor()){
      startPhase('participants',7000);
    }else{
      startPhase('score',15000);
    }
    return;
  }
  if(phase==='ad'){return;}
}
function pausePhase(){if(phase==='ad')return;pausedPhase=phase;pausedRemaining=Math.max(0,phaseEndsAt-Date.now());clearPhaseTimer();}
function resumePhase(){const p=pausedPhase||'score',r=pausedRemaining||15000;pausedPhase=null;pausedRemaining=0;startPhase(p,r);}
function scoreInterrupt(){if(adPlaying||$('announcement').classList.contains('show'))return;if(!pausedPhase)pausePhase();startPhase('score',5000);clearTimeout(scoreReturnTimer);scoreReturnTimer=setTimeout(()=>{if(phase==='score'&&pausedPhase)resumePhase();},5000);}
function processWinnerQueue(){if(adPlaying||!winnerQueue.length)return;clearTimeout(adWaitTimer);adWaitTimer=null;const w=winnerQueue.shift();pendingWinnerCount=winnerQueue.length;notifyQueue();if(!pausedPhase)pausePhase();showAnnouncement(w);}
function notifyQueue(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'announcement-queue',count:pendingWinnerCount,adPlaying}));}
function showAnnouncement(w){$('a-position').textContent=displayPosition(w.position);const photo=$('a-photo'),url=isRelay(w.event)?'':safePhoto(w.photoUrl);photo.src=url;photo.style.display=url?'block':'none';photo.onerror=()=>photo.style.display='none';$('a-name').textContent=isRelay(w.event)?w.school:w.name;$('a-school').textContent=isRelay(w.event)?'RELAY TEAM':w.school;$('a-detail').textContent=[w.event,w.ageCategory,w.gender,w.chest?'Chest No. '+w.chest:''].filter(Boolean).join(' · ');$('announcement').classList.add('show');clearTimeout(announcementTimer);announcementTimer=setTimeout(()=>{$('announcement').classList.remove('show');startPhase('score',5000);scoreReturnTimer=setTimeout(()=>{if(winnerQueue.length)processWinnerQueue();else resumePhase();},5000);},6500);}
function receiveWinner(w){if(adPlaying){winnerQueue.push(w);pendingWinnerCount=winnerQueue.length;notifyQueue();return;}winnerQueue.push(w);processWinnerQueue();}
async function fetchAds(){try{const r=await fetch('/api/ads',{cache:'no-store'});const d=await r.json();adFiles=Array.isArray(d.ads)?d.ads:[];}catch{adFiles=[];}}
function maybeAd(){
  if(!adConfig.enabled||!adFiles.length||adPlaying||adPending||!adConfig.nextAdAt)return false;
  if(serverNow()<Number(adConfig.nextAdAt))return false;
  adPending=true;
  if(phase==='score'&&!pausedPhase&&!winnerQueue.length&&!$('announcement').classList.contains('show'))startPhase('score',15000);
  publishViewerStatus();return true;
}
function playNextAd(){if(!adConfig.enabled||!adFiles.length){adPending=false;resumePhase();return;}clearPhaseTimer();adPending=false;lastAdClock=Date.now();adPlaying=true;phase='ad';show('ad');if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'ad-started'}));publishViewerStatus();const video=$('ad-video');const file=adFiles[adIndex%adFiles.length];adIndex=(adIndex+1)%adFiles.length;video.src=file.url;video.currentTime=0;notifyQueue();video.onended=()=>finishAd();video.onerror=()=>finishAd();video.play().catch(()=>finishAd());}
function finishAd(){const video=$('ad-video');video.pause();video.removeAttribute('src');video.load();adPlaying=false;lastAdClock=Date.now();if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'ad-finished'}));notifyQueue();if(winnerQueue.length){processWinnerQueue();}else{startPhase('score',5000);scoreReturnTimer=setTimeout(()=>resumePhase(),5000);}}
function updateAdConfig(c){adConfig={enabled:!!c.enabled,intervalMinutes:Math.max(1,Number(c.intervalMinutes)||3),nextAdAt:Number(c.nextAdAt)||0};if(!adConfig.enabled){adPending=false;clearTimeout(adWaitTimer);if(adPlaying)finishAd();}publishViewerStatus();}
function applyState(s){scores=s.scores||[];winners=s.winners||[];renderScores();renderWinnerPage();if(!phaseTimer&&!pausedPhase)startPhase('score',15000);}
function connect(){const protocol=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${protocol}://${location.host}`);ws.onopen=()=>{retry=0;notifyQueue();};ws.onclose=()=>{setTimeout(connect,Math.min(10000,1000*2**retry++));};ws.onerror=()=>ws.close();ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.serverNow)serverClockOffset=Number(d.serverNow)-Date.now();if(d.type==='init-state'||d.type==='state'){applyState(d.state||{});if(d.adConfig)updateAdConfig(d.adConfig);}if(d.type==='ad-config'||d.type==='ad-schedule')updateAdConfig(d.adConfig||d.config||{});if(d.type==='ad-list')adFiles=d.ads||[];if(d.type==='score'){scores[d.index]=d.value;renderScores();scoreInterrupt();}if(d.type==='winner'){if(d.winners)winners=d.winners;else if(d.winner)winners.push(d.winner);renderWinnerPage();receiveWinner(d.winner||{});}if(d.type==='ping')return;};}
window.addEventListener('resize',()=>{renderScores();if(phase==='winners')renderWinnerPage();if(phase==='participants')renderParticipantPage();});
fetch('/api/state').then(r=>r.json()).then(applyState).catch(()=>{});fetch('/api/schools',{cache:'no-store'}).then(r=>r.json()).then(d=>{registeredSchools=Array.isArray(d.schools)?d.schools:[];renderScores();}).catch(()=>{});loadParticipants();fetchAds();connect();setInterval(loadParticipants,120000);
setInterval(()=>{if(!adPlaying)maybeAd();publishViewerStatus();},1000);
</script></body></html>
