<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CDS Sports Meet 2K26 — Live Results</title>
<style>
:root{--bg:#080b12;--panel:rgba(18,23,34,.88);--gold:#e8c779;--muted:#a9b1c1;--line:rgba(232,199,121,.2)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f7f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% -15%,rgba(170,126,48,.22),transparent 48%),linear-gradient(135deg,#080b12,#111827 60%,#090d16);z-index:-1}.shell{height:100%;padding:3vh 4vw;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{font-size:clamp(10px,1vw,15px);letter-spacing:.35em;color:var(--gold);text-transform:uppercase}.title{font-size:clamp(24px,3vw,48px);letter-spacing:.08em;font-weight:800;margin:8px 0 0}.live{color:#8ee0ae;font-size:13px;letter-spacing:.2em}.screen{position:absolute;inset:15vh 4vw 4vh;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .8s ease,transform .8s ease}.screen.active{opacity:1;transform:none;pointer-events:auto}.scoreboard{display:flex;flex-direction:column;min-height:0;overflow:hidden}.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:14px;flex:0 0 clamp(145px,26vh,235px);min-height:0}.school-card,.table-card,.winner-card{background:linear-gradient(145deg,rgba(27,34,48,.96),rgba(11,15,24,.96));border:1px solid rgba(255,255,255,.09);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.school-card{position:relative;text-align:center;padding:clamp(14px,1.5vw,26px) clamp(34px,3vw,54px) clamp(10px,1.2vw,20px);min-height:0;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.podium-copy{flex:1;min-width:0;max-width:100%}.podium-medal{position:absolute;top:clamp(9px,1vw,15px);right:clamp(10px,1.1vw,17px);font-size:clamp(23px,2.1vw,34px);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}.school-card.gold{border-color:#c9a44d;box-shadow:0 0 35px rgba(201,164,77,.13)}.school-card.silver{border-color:#8795a8}.school-card.bronze{border-color:#a76e48}.rank{display:none}.school-name{font-size:clamp(17px,1.75vw,29px);font-weight:800;line-height:1.14;margin:8px 0;overflow-wrap:anywhere;word-break:normal}.score{font-size:clamp(38px,3.8vw,62px);font-weight:850;color:#8de0aa;font-variant-numeric:tabular-nums}.rest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,.9vw,14px);overflow:hidden;flex:1 1 0;min-height:0;min-width:0;align-content:stretch;align-items:stretch;padding:2px}.table-card{aspect-ratio:auto;min-height:0;min-width:0;width:100%;height:100%;box-sizing:border-box;padding:clamp(7px,.8vw,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(5px,.65vw,11px);overflow:hidden}.table-card .school-name{font-size:clamp(11px,1.05vw,20px);font-weight:800;margin:0;line-height:1.12;overflow-wrap:anywhere;word-break:normal}.small-score{font-size:clamp(20px,1.9vw,36px);font-weight:850;color:#8de0aa;flex:0 0 auto}.winners-screen{display:flex;flex-direction:column}.winners-head{text-align:center;margin-bottom:22px}.winners-head h2{font-size:clamp(28px,4vw,54px);letter-spacing:.14em;margin:0;color:var(--gold)}.winners-head p{color:var(--muted);letter-spacing:.28em;font-size:12px}.winners-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;overflow:auto;padding:4px 4px 24px}.winner-card{padding:20px;min-height:155px;position:relative;overflow:hidden}.winner-card:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-90px;top:-90px;background:radial-gradient(circle,rgba(232,199,121,.16),transparent 70%)}.medal{color:var(--gold);font-size:12px;letter-spacing:.25em;text-transform:uppercase}.winner-name{font-size:clamp(17px,1.7vw,25px);font-weight:800;margin:12px 0 6px}.winner-school{color:#e1e5ec;font-size:14px}.winner-meta{color:var(--muted);font-size:12px;margin-top:10px}.announcement{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,4,9,.88);backdrop-filter:blur(14px);z-index:10;opacity:0;pointer-events:none;transition:opacity .5s}.announcement.show{opacity:1}.announce-card{width:min(900px,88vw);padding:clamp(28px,5vw,70px);border:1px solid rgba(232,199,121,.55);border-radius:28px;text-align:center;background:radial-gradient(ellipse at 50% 0,rgba(190,143,55,.25),transparent 60%),linear-gradient(145deg,#1a2030,#080b12);box-shadow:0 0 100px rgba(204,158,68,.18)}.announce-kicker{letter-spacing:.4em;color:var(--gold);font-size:13px}.announce-position{font-size:clamp(44px,8vw,100px);font-weight:900;color:var(--gold);margin:14px 0}.announce-name{font-size:clamp(28px,5vw,60px);font-weight:850}.announce-school{font-size:clamp(17px,2vw,25px);margin-top:12px}.announce-detail{color:var(--muted);margin-top:18px;letter-spacing:.12em}.footer{position:fixed;bottom:18px;left:4vw;right:4vw;display:flex;justify-content:space-between;color:#778195;font-size:11px;letter-spacing:.15em}.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}@media(max-width:850px){.school-card{min-height:0}.winners-grid{grid-template-columns:repeat(2,1fr)}.screen{inset:16vh 3vw 4vh}.rest{gap:8px}.table-card .school-name{font-size:clamp(10px,1.8vw,16px)}}@media(max-width:560px){.podium{gap:6px;flex-basis:clamp(112px,21vh,155px)}.school-card{padding:7px 4px;gap:4px;flex-direction:column}.podium-medal{font-size:clamp(18px,4vw,25px);top:6px;right:7px}.school-name{font-size:11px}.score{font-size:clamp(20px,5vw,28px)}.table-card{padding:5px;gap:4px}.table-card .school-name{font-size:clamp(8px,2.2vw,12px)}.small-score{font-size:clamp(15px,4vw,22px)}.rest{gap:5px}.winners-grid{grid-template-columns:1fr}.top{align-items:flex-start}.live{font-size:10px}}

.page-count{position:absolute;bottom:2vh;right:3vw;color:rgba(255,255,255,.55);font-size:clamp(11px,1vw,15px);letter-spacing:.12em}.winners-screen{padding-bottom:5vh}.winners-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);align-content:stretch}.winner-card{min-height:0;display:flex;flex-direction:column;justify-content:center}.winners-head h2{letter-spacing:.08em}.participants-screen{background:radial-gradient(ellipse at 50% 0,rgba(37,87,112,.2),transparent 55%),#080d16}.participants-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(10px,1.2vw,20px);height:calc(100% - 115px);overflow:hidden}.participant-card{min-height:0;display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:clamp(10px,1.2vw,18px);border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(145deg,rgba(28,41,61,.96),rgba(12,19,30,.96));overflow:hidden}.participant-card img{width:clamp(64px,7vw,112px);height:clamp(64px,7vw,112px);object-fit:cover;border-radius:14px;background:#263246;flex:none}.participant-card .p-name{font-size:clamp(15px,1.6vw,25px);font-weight:800;line-height:1.15}.participant-card .p-school{font-size:clamp(11px,1.05vw,16px);color:#c4cfdd;margin-top:7px}.participant-card .p-chest{font-size:clamp(10px,.9vw,14px);color:#d9bb75;margin-top:5px}.ad-screen{inset:0!important;background:#000!important;padding:0!important}.ad-screen video{width:100%;height:100%;object-fit:contain;background:#000}.screen{transition:opacity .7s ease,transform .7s ease}@media(max-width:1000px){.winners-grid,.participants-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.winners-grid,.participants-grid{grid-template-columns:1fr}.participant-card img{width:58px;height:58px}}
</style></head><body><div class="shell"><header class="top"><div><div class="eyebrow">Capital District Sahodaya · Official Results</div><h1 class="title">CDS SPORTS MEET 2K26</h1></div><div class="live">● LIVE RESULTS</div></header></div>
<section id="score-screen" class="screen scoreboard active"><div id="podium" class="podium"></div><div id="school-rest" class="rest"></div></section>
<section id="winners-screen" class="screen winners-screen"><div class="winners-head"><h2>CONGRATULATIONS WINNERS</h2><p>CELEBRATING OUR ACHIEVERS</p></div><div id="winners-grid" class="winners-grid"></div><div id="winner-page-count" class="page-count"></div></section>
<section id="participants-screen" class="screen participants-screen"><div class="winners-head"><h2>EVENT PARTICIPANTS</h2><p id="participant-event-label">REGISTERED PARTICIPANTS</p></div><div id="participants-grid" class="participants-grid"></div><div id="participant-page-count" class="page-count"></div></section>
<section id="ad-screen" class="screen ad-screen"><video id="ad-video" playsinline preload="auto"></video></section>
<div id="announcement" class="announcement"><div class="announce-card"><div class="announce-kicker">CDS SPORTS MEET 2K26 · OFFICIAL ANNOUNCEMENT</div><div id="a-position" class="announce-position">GOLD</div><div id="a-name" class="announce-name"></div><div id="a-school" class="announce-school"></div><div id="a-detail" class="announce-detail"></div></div></div>
<script>
const DEFAULT_SCHOOLS=[];
let scores=[],winners=[],registeredSchools=[],participants=[],ws,retry=0;
let adConfig={enabled:false,intervalMinutes:3},adFiles=[],adIndex=0,adPlaying=false,adDueAt=0,lastAdClock=Date.now();
let phase='score',phaseTimer=null,phaseEndsAt=0,pausedPhase=null,pausedRemaining=0,scoreReturnTimer=null;
let winnerQueue=[],pendingWinnerCount=0,winnerPages=[],winnerPageIndex=0,participantGroups=[],participantEventIndex=0,participantOffsets={};
const $=id=>document.getElementById(id);const isRelay=e=>/relay/i.test(e||'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function displayPosition(p){return ({Gold:'1st',Silver:'2nd',Bronze:'3rd',gold:'1st',silver:'2nd',bronze:'3rd'}[String(p||'')]||String(p||'WINNER'));}
function safePhoto(url){try{const u=new URL(String(url||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function renderScores(){const schools=[...new Set(registeredSchools.map(name=>String(name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const rows=schools.map((name,i)=>({name,score:Number(scores[i]?.score??scores[i]??0),i})).sort((a,b)=>b.score-a.score);const rest=rows.slice(3);$('podium').innerHTML=rows.slice(0,3).map((s,i)=>`<article class="school-card ${['gold','silver','bronze'][i]}"><div class="podium-copy"><div class="school-name">${esc(s.name)}</div><div class="score">${s.score}</div></div><div class="podium-medal">${['🥇','🥈','🥉'][i]}</div></article>`).join('');const grid=$('school-rest');grid.innerHTML=rest.map(s=>`<article class="table-card"><div class="school-name">${esc(s.name)}</div><div class="small-score">${s.score}</div></article>`).join('');let cols=rest.length<=6?3:rest.length<=12?4:rest.length<=20?5:6;cols=Math.min(cols,Math.max(1,rest.length));const rc=Math.ceil(rest.length/cols);grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${Math.max(1,rc)},minmax(0,1fr))`;}
function winnerCapacity(){const w=window.innerWidth,h=window.innerHeight;const cols=w<650?1:w<1050?2:4;const rows=h<650?2:h<850?3:4;return Math.max(1,cols*rows);}
function buildWinnerPages(){const ordered=[...winners].sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0));const size=winnerCapacity();winnerPages=[];for(let i=0;i<ordered.length;i+=size)winnerPages.push(ordered.slice(i,i+size));if(!winnerPages.length)winnerPages=[[]];}
function renderWinnerPage(){buildWinnerPages();winnerPageIndex=Math.min(winnerPageIndex,winnerPages.length-1);const page=winnerPages[winnerPageIndex]||[];$('winners-grid').innerHTML=page.length?page.map(w=>`<article class="winner-card"><div class="medal">${esc(displayPosition(w.position))}</div>${!isRelay(w.event)&&safePhoto(w.photoUrl)?`<img class="winner-photo" src="${esc(safePhoto(w.photoUrl))}" alt="${esc(w.name||'Winner')}" onerror="this.style.display='none'">`:''}<div class="winner-name">${esc(isRelay(w.event)?w.school:w.name)}</div><div class="winner-school">${esc(isRelay(w.event)?'Relay Team':w.school)}</div><div class="winner-meta">${esc(w.event)} · ${esc(w.ageCategory||'')}</div></article>`).join(''):'<div class="empty">Winners will appear here after announcements.</div>';$('winner-page-count').textContent=winnerPages.length>1?`PAGE ${winnerPageIndex+1} / ${winnerPages.length}`:'';}
function normalizeParticipant(r){const name=r.name??r.Name??r.participantName??r.participant_name??'';const school=r.school??r.School??r.schoolName??r.school_name??'';let ev=r.event??r.Event??r.events??r.eventName??r.event_name??'';const events=Array.isArray(ev)?ev.map(x=>typeof x==='string'?x:(x.name||x.event||'')):String(ev).split(/[,;|]/).map(x=>x.trim()).filter(Boolean);return events.map(event=>({name:String(name).trim(),school:String(school).trim(),event:String(event).trim(),age:String(r.ageCategory??r['Age Category']??r.age_category??r.category??'').trim(),gender:String(r.gender??r.Gender??'').trim(),chest:String(r.chest??r.Chest??r.chestNumber??r.chest_number??''),photo:safePhoto(r.photoUrl??r.photoPath??r['Photo URL']??r.photo??r.photo_url??'')})).filter(x=>x.name&&x.school&&x.event);}
async function loadParticipants(){try{const res=await fetch('/api/participants',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const d=await res.json();const rows=Array.isArray(d)?d:(d.participants||d.results||d.data||[]);participants=rows.flatMap(normalizeParticipant);const grouped=new Map();for(const p of participants){if(!grouped.has(p.event))grouped.set(p.event,[]);grouped.get(p.event).push(p);}participantGroups=[...grouped.entries()].sort((a,b)=>a[0].localeCompare(b[0]));}catch(e){console.warn('Participant showcase unavailable',e);}}
function participantCapacity(){const cols=window.innerWidth<650?1:window.innerWidth<1050?2:4;const rows=window.innerHeight<650?2:window.innerHeight<850?2:3;return Math.max(1,cols*rows);}
function advanceParticipantCursor(){if(!participantGroups.length)return;const [event,list]=participantGroups[participantEventIndex]||[];const next=(participantOffsets[event]||0)+participantCapacity();if(next<list.length){participantOffsets[event]=next;}else{participantOffsets[event]=0;participantEventIndex=(participantEventIndex+1)%participantGroups.length;}}
function renderParticipantPage(){if(!participantGroups.length){$('participant-event-label').textContent='NO PARTICIPANT DATA AVAILABLE';$('participants-grid').innerHTML='<div class="empty">Participant registrations will appear here when available.</div>';$('participant-page-count').textContent='';return;}if(participantEventIndex>=participantGroups.length)participantEventIndex=0;const [event,list]=participantGroups[participantEventIndex];const size=participantCapacity();let offset=participantOffsets[event]||0;if(offset>=list.length)offset=0;const page=list.slice(offset,offset+size);$('participant-event-label').textContent=event.toUpperCase();$('participants-grid').innerHTML=page.map(p=>`<article class="participant-card"><img src="${esc(p.photo||'') }" alt="" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23263347%22/%3E%3Ccircle cx=%2250%22 cy=%2236%22 r=%2218%22 fill=%22%23899ab0%22/%3E%3Cpath d=%22M15 100c2-25 15-38 35-38s33 13 35 38%22 fill=%22%23899ab0%22/%3E%3C/svg%3E'"><div><div class="p-name">${esc(p.name)}</div><div class="p-school">${esc(p.school)}</div><div class="p-chest">${[p.age,p.gender,p.chest?'Chest '+p.chest:''].filter(Boolean).map(esc).join(' · ')}</div></div></article>`).join('');$('participant-page-count').textContent=`${Math.floor(offset/size)+1} / ${Math.ceil(list.length/size)} · ${participantEventIndex+1} OF ${participantGroups.length} EVENTS`;}
function show(which){phase=which;for(const id of ['score','winners','participants','ad']){$(id+'-screen').classList.toggle('active',which===id);}}
function clearPhaseTimer(){if(phaseTimer){clearTimeout(phaseTimer);phaseTimer=null;}}
function startPhase(which,duration=15000){clearPhaseTimer();show(which);if(which==='winners'){winnerPageIndex=0;renderWinnerPage();}if(which==='participants')renderParticipantPage();phaseEndsAt=Date.now()+duration;phaseTimer=setTimeout(advancePhase,duration);}
function advancePhase(){phaseTimer=null;if(phase==='winners'){if(winnerPageIndex+1<winnerPages.length){winnerPageIndex++;renderWinnerPage();phaseEndsAt=Date.now()+15000;phaseTimer=setTimeout(advancePhase,15000);return;}startPhase('score',15000);return;}if(phase==='score'){if(winners.length>=5)startPhase('winners',15000);else startPhase('participants',15000);return;}if(phase==='participants'){advanceParticipantCursor();startPhase('score',15000);return;}if(phase==='ad'){return;}}
function pausePhase(){if(phase==='ad')return;pausedPhase=phase;pausedRemaining=Math.max(0,phaseEndsAt-Date.now());clearPhaseTimer();}
function resumePhase(){const p=pausedPhase||'score',r=pausedRemaining||15000;pausedPhase=null;pausedRemaining=0;startPhase(p,r);}
function scoreInterrupt(){if(adPlaying||$('announcement').classList.contains('show'))return;if(!pausedPhase)pausePhase();startPhase('score',5000);clearTimeout(scoreReturnTimer);scoreReturnTimer=setTimeout(()=>{if(phase==='score'&&pausedPhase)resumePhase();},5000);}
function processWinnerQueue(){if(adPlaying||!winnerQueue.length)return;const w=winnerQueue.shift();pendingWinnerCount=winnerQueue.length;notifyQueue();if(!pausedPhase)pausePhase();showAnnouncement(w);}
function notifyQueue(){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'announcement-queue',count:pendingWinnerCount,adPlaying}));}
function showAnnouncement(w){$('a-position').textContent=displayPosition(w.position);const photo=$('a-photo'),url=isRelay(w.event)?'':safePhoto(w.photoUrl);photo.src=url;photo.style.display=url?'block':'none';photo.onerror=()=>photo.style.display='none';$('a-name').textContent=isRelay(w.event)?w.school:w.name;$('a-school').textContent=isRelay(w.event)?'RELAY TEAM':w.school;$('a-detail').textContent=[w.event,w.ageCategory,w.gender,w.chest?'Chest No. '+w.chest:''].filter(Boolean).join(' · ');$('announcement').classList.add('show');clearTimeout(announcementTimer);announcementTimer=setTimeout(()=>{$('announcement').classList.remove('show');startPhase('score',5000);scoreReturnTimer=setTimeout(()=>{if(winnerQueue.length)processWinnerQueue();else resumePhase();},5000);},6500);}
function receiveWinner(w){if(adPlaying){winnerQueue.push(w);pendingWinnerCount=winnerQueue.length;notifyQueue();return;}winnerQueue.push(w);processWinnerQueue();}
async function fetchAds(){try{const r=await fetch('/api/ads',{cache:'no-store'});const d=await r.json();adFiles=Array.isArray(d.ads)?d.ads:[];}catch{adFiles=[];}}
function maybeAd(){if(!adConfig.enabled||!adFiles.length||adPlaying)return false;const interval=Math.max(1,Number(adConfig.intervalMinutes)||3)*60000;if(Date.now()-lastAdClock<interval)return false;lastAdClock=Date.now();pausePhase();startPhase('score',15000);setTimeout(()=>playNextAd(),15000);return true;}
function playNextAd(){if(!adConfig.enabled||!adFiles.length){resumePhase();return;}clearPhaseTimer();adPlaying=true;phase='ad';show('ad');const video=$('ad-video');const file=adFiles[adIndex%adFiles.length];adIndex=(adIndex+1)%adFiles.length;video.src=file.url;video.currentTime=0;notifyQueue();video.onended=()=>finishAd();video.onerror=()=>finishAd();video.play().catch(()=>finishAd());}
function finishAd(){const video=$('ad-video');video.pause();video.removeAttribute('src');video.load();adPlaying=false;lastAdClock=Date.now();notifyQueue();if(winnerQueue.length){processWinnerQueue();}else{startPhase('score',5000);scoreReturnTimer=setTimeout(()=>resumePhase(),5000);}}
function updateAdConfig(c){adConfig={enabled:!!c.enabled,intervalMinutes:Math.max(1,Number(c.intervalMinutes)||3)};if(!adConfig.enabled&&adPlaying)finishAd();}
function applyState(s){scores=s.scores||[];winners=s.winners||[];renderScores();renderWinnerPage();if(!phaseTimer&&!pausedPhase)startPhase('score',15000);}
function connect(){const protocol=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${protocol}://${location.host}`);ws.onopen=()=>{retry=0;notifyQueue();};ws.onclose=()=>{setTimeout(connect,Math.min(10000,1000*2**retry++));};ws.onerror=()=>ws.close();ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='init-state'||d.type==='state'){applyState(d.state||{});if(d.adConfig)updateAdConfig(d.adConfig);}if(d.type==='ad-config')updateAdConfig(d.config||{});if(d.type==='ad-list')adFiles=d.ads||[];if(d.type==='score'){scores[d.index]=d.value;renderScores();scoreInterrupt();}if(d.type==='winner'){if(d.winners)winners=d.winners;else if(d.winner)winners.push(d.winner);renderWinnerPage();receiveWinner(d.winner||{});}if(d.type==='ping')return;};}
window.addEventListener('resize',()=>{renderScores();if(phase==='winners')renderWinnerPage();if(phase==='participants')renderParticipantPage();});
fetch('/api/state').then(r=>r.json()).then(applyState).catch(()=>{});fetch('/api/schools',{cache:'no-store'}).then(r=>r.json()).then(d=>{registeredSchools=Array.isArray(d.schools)?d.schools:[];renderScores();}).catch(()=>{});loadParticipants();fetchAds();connect();setInterval(loadParticipants,120000);
setInterval(()=>{if(!adPlaying&&maybeAd()){}},1000);
</script></body></html>
